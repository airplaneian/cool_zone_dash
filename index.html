<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cool Zone Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="toolbar">
        <span class="brand-key">CZ</span>
        <span class="toolbar-label">RANGE</span>
        <div id="window-bar" class="window-bar"></div>
        <span id="window-dates" class="window-dates"></span>
        <button id="cfg-open" class="cfg-open">ALERT CFG</button>
        <span id="clock" class="clock"></span>
    </header>

    <div class="alert-strip">
        <span class="alert-strip-label">ALERTS</span>
        <div id="alert-list" class="alert-list"></div>
    </div>

    <main class="dashboard">
        <section class="panel" id="metric-oil"></section>
        <section class="panel" id="metric-soxx"></section>
        <section class="panel" id="metric-treasury"></section>
        <section class="panel" id="metric-sp500-divergence"></section>
        <section class="panel" id="metric-owl"></section>
    </main>

    <footer class="statusbar">
        <span>SRC YAHOO FINANCE</span>
        <span>REFRESH 15M</span>
        <span id="last-update">LAST UPD --:--:--</span>
        <span id="stream-status" class="stream-status"></span>
        <span class="credit">an <a href="https://bsky.app/profile/airplaneian.com" target="_blank" rel="noopener">@airplaneian</a> joint</span>
    </footer>

    <div id="cfg" class="cfg" hidden>
        <div class="cfg-backdrop"></div>
        <aside class="cfg-drawer">
            <header class="cfg-head">
                <span>ALERT CONFIGURATION</span>
                <button id="cfg-close" class="cfg-close" aria-label="Close">✕</button>
            </header>
            <div id="cfg-body" class="cfg-body"></div>
            <footer class="cfg-foot">
                <span>SAVED IN THIS BROWSER</span>
                <button id="cfg-reset" class="cfg-reset">RESET DEFAULTS</button>
            </footer>
        </aside>
    </div>

    <script src="app.js"></script>
</body>

</html>
